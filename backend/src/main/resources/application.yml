server:
  port: 8080

spring:
  application:
    name: travel-booking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # Clé de DÉVELOPPEMENT uniquement. En production : variable d'environnement JWT_SECRET.
    secret: ${JWT_SECRET:LiQNbj33NM7FuhStZthYAFc/eBnNHDRBsPQCpVcPJNAio+W9B4PRUireMzXtFse6}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
